G.fil = { hint:'Ariane t\'a laissé son fil d\'or. Suis les lueurs pour sortir du labyrinthe.', alt:'Sortir du labyrinthe',
  mount(c){
    const P = [[10, 84], [10, 18], [37, 18], [37, 62], [64, 62], [64, 22], [90, 22]], s = c.stage;
    s.style.touchAction = 'none';
    s.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
      + '<path class="mur" vector-effect="non-scaling-stroke" d="M2 6H98V12M98 32V96H2V6M24 30V96M50 6V50M24 74H78M78 34V96M78 34H98"/>'
      + '<polyline class="fil" vector-effect="non-scaling-stroke" points=""/></svg>';
    const line = s.querySelector('.fil');
    let at = 0, fini = false;
    const btns = P.map((pt, i) => {
      const b = el('button', 'lueur' + (i === P.length - 1 ? ' porte' : '')); b.type = 'button';
      b.style.left = pt[0] + '%'; b.style.top = pt[1] + '%';
      b.setAttribute('aria-label', i === 0 ? 'Le début du fil' : i === P.length - 1 ? 'La sortie du labyrinthe' : 'Lueur ' + i);
      b.addEventListener('click', e => { if(e.detail === 0) tap(i); });   // clavier
      s.append(b); return b;
    });
    const draw = () => {
      line.setAttribute('points', P.slice(0, at + 1).map(p => p.join(',')).join(' '));
      btns.forEach((b, i) => { b.classList.toggle('ok', i <= at); b.classList.toggle('next', i === at + 1); b.disabled = i <= at; });
    };
    const done = () => { if(fini) return; fini = true; s.classList.add('out'); Snd.play('bloom'); buzz([20, 40, 60]);
      c.say('Te voilà sortie du labyrinthe.'); c.later(() => c.reveal(), RM ? 0 : 1300); };
    const step = () => {
      if(fini) return; at++; draw(); Snd.play('chime', {n:at}); buzz(10);
      if(at === P.length - 1) done();
      else c.say(at === P.length - 2 ? 'La sortie est tout près…' : 'Continue, le fil te guide.');
      if(document.activeElement && document.activeElement.classList.contains('lueur')) focusSoft(btns[at + 1]);
    };
    const tap = i => { if(fini) return; if(i === at + 1) step(); else if(i > at + 1){ nudge(btns[i]); c.say('Suis le fil dans l\'ordre : la lueur qui brille.'); } };
    // Du doigt : passer sur la lueur suivante suffit
    const near = e => {
      if(fini) return; const r = s.getBoundingClientRect(), n = P[at + 1]; if(!n) return;
      if(Math.hypot(e.clientX - r.left - n[0] / 100 * r.width, e.clientY - r.top - n[1] / 100 * r.height) < 30) step();
    };
    let down = false;
    s.addEventListener('pointerdown', e => { down = true; near(e); });
    s.addEventListener('pointermove', e => { if(down) near(e); });
    ['pointerup', 'pointercancel'].forEach(ev => s.addEventListener(ev, () => { down = false; }));
    draw();
    c.onAlt = () => { if(fini) return; const go = () => { if(fini) return; step(); if(!fini) c.later(go, RM ? 0 : 160); }; go(); };
  }
};

/* 9. La lyre d'Orphée : faire vibrer les cinq cordes */
G.lyre = { hint:'La lyre d\'Orphée. Fais vibrer ses cinq cordes, une à une ou d\'un seul glissé.', alt:'Faire chanter la lyre',
  mount(c){
    const X = [61, 83, 105, 127, 149], F = [392, 440, 523, 587, 659];
    const w = el('div', 'lyre');
    w.innerHTML = '<svg viewBox="0 0 210 236" aria-hidden="true">'
      + '<path class="bois" d="M52 204C22 172 18 112 40 72 52 48 42 28 28 20"/><path class="bois" d="M158 204C188 172 192 112 170 72 158 48 168 28 182 20"/>'
      + '<path class="bois" d="M38 52H172" stroke-width="5"/><path class="bois" d="M50 204H160" stroke-width="10"/>'
      + X.map((x, i) => '<line class="corde" data-i="' + i + '" x1="' + x + '" y1="52" x2="' + x + '" y2="200"/>').join('') + '</svg>';
    c.stage.append(w);
    const cordes = Array.from(w.querySelectorAll('.corde')), ok = X.map(() => false);
    let n = 0, fini = false;
    X.forEach((x, i) => {
      const b = el('button', 'cbtn'); b.type = 'button'; b.style.left = x + 'px'; b.setAttribute('aria-label', 'Corde ' + (i + 1) + ' sur 5');
      b.addEventListener('click', e => { if(e.detail === 0) pluck(i); }); w.append(b);
    });
    const pluck = i => {
      const k = cordes[i]; k.classList.remove('vib'); void k.getBoundingClientRect(); k.classList.add('vib');
      Snd.play('pluck', {f:F[i]}); buzz(6);
      if(!RM){ const nv = el('span', 'note-v', '♪'); nv.style.left = (X[i] - 6) + 'px'; nv.style.top = '40px'; nv.style.setProperty('--nx', rnd(-20, 20).toFixed(0) + 'px'); w.append(nv); c.later(() => nv.remove(), 1700); }
      if(fini || ok[i]) return;
      ok[i] = true; k.classList.add('ok'); n++;
      if(n < 5) c.say(n === 4 ? 'Plus qu\'une corde…' : 'Encore ' + (5 - n) + ' cordes.');
      else { fini = true; c.say('Orphée joue pour toi…'); c.later(() => { Snd.play('bloom'); buzz([20, 30, 40]); }, 300); c.later(() => c.reveal(), RM ? 0 : 1500); }
    };
    // Glisser le doigt à travers les cordes
    let last = null;
    const xIn = e => e.clientX - w.getBoundingClientRect().left;
    w.addEventListener('pointerdown', e => {
      e.preventDefault(); last = xIn(e);
      let best = -1, d = 14; X.forEach((x, i) => { const dd = Math.abs(x - last); if(dd < d){ d = dd; best = i; } });
      if(best >= 0) pluck(best);
      try{ w.setPointerCapture(e.pointerId); }catch(x){}
    });
    w.addEventListener('pointermove', e => {
      if(last == null) return; const x = xIn(e), a = Math.min(last, x), b = Math.max(last, x);
      X.forEach((sx, i) => { if(sx > a && sx <= b) pluck(i); }); last = x;
    });
    ['pointerup', 'pointercancel'].forEach(ev => w.addEventListener(ev, () => { last = null; }));
    c.onAlt = () => X.forEach((x, i) => c.later(() => pluck(i), RM ? 0 : i * 130));
  }
};

/* 10. La flèche d'Éros : tirer la corde, puis lâcher */
G.fleche = { hint:'Éros te prête son arc. Tire la corde vers la gauche, puis lâche.', alt:'Décocher la flèche',
  mount(c){
    const s = c.stage, BX = 78, Y = 125;
    s.innerHTML = '<svg viewBox="0 0 360 250" aria-hidden="true">'
      + '<g class="coeur"><path d="M300 150c-26-18-40-32-40-48 0-12 9-21 20-21 9 0 16 5 20 13 4-8 11-13 20-13 11 0 20 9 20 21 0 16-14 30-40 48z" fill="#8b0016" stroke="#e8536a" stroke-width="1.5"/></g>'
      + '<g class="eclat" stroke="#ffd6a0" stroke-width="2" stroke-linecap="round"><path d="M300 70v-16M340 90l12-10M260 90l-12-10M346 128h16M254 128h-16"/></g>'
      + '<path class="arc" d="M' + BX + ' 40Q148 ' + Y + ' ' + BX + ' 210"/>'
      + '<polyline class="corde-arc" points=""/>'
      + '<g class="trait"><path d="M0 0H118" stroke="#e9e0cf" stroke-width="2.4"/><path d="M118 -7L134 0 118 7z" fill="#c9a96e"/>'
      + '<path d="M2 0l-12-8M2 0l-12 8M10 0l-12-8M10 0l-12 8" stroke="#d0213f" stroke-width="2"/></g></svg>';
    const svg = s.firstChild, corde = svg.querySelector('.corde-arc'), trait = svg.querySelector('.trait');
    s.style.touchAction = 'none';
    let pull = 0, x0 = null, fini = false;
    const draw = () => {
      const nx = BX - pull * 52;
      corde.setAttribute('points', BX + ',40 ' + nx + ',' + Y + ' ' + BX + ',210');
      trait.setAttribute('transform', 'translate(' + nx + ' ' + Y + ')');
    };
    const fire = () => {
      if(fini) return; fini = true; Snd.play('whoosh'); buzz(16);
      const from = BX - pull * 52, to = 262 - 134 + 20, t0 = performance.now(), D = RM ? 1 : 320;
      corde.setAttribute('points', BX + ',40 ' + BX + ',' + Y + ' ' + BX + ',210');
      const fly = now => {
        const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
        trait.setAttribute('transform', 'translate(' + (from + (to - from) * e) + ' ' + Y + ')');
        if(k < 1) requestAnimationFrame(fly);
        else { s.classList.add('touche'); Snd.play('chime', {n:5}); Snd.play('bloom'); buzz([30, 40, 80]); c.say('En plein cœur.'); c.later(() => c.reveal(), RM ? 0 : 1300); }
      };
      requestAnimationFrame(fly);
    };
    const k = () => { const r = s.getBoundingClientRect(); return Math.min(r.width / 360, r.height / 250); };
    s.addEventListener('pointerdown', e => { if(fini) return; e.preventDefault(); x0 = e.clientX; try{ s.setPointerCapture(e.pointerId); }catch(x){} });
    s.addEventListener('pointermove', e => {
      if(x0 == null || fini) return;
      const p = clamp((x0 - e.clientX) / k() / 52, 0, 1);
      if(p > .6 && pull <= .6) buzz(8);
      pull = p; draw();
      c.say(p > .6 ? 'Lâche !' : 'Tire encore…');
    });
    const up = () => {
      if(x0 == null || fini) return; x0 = null;
      if(pull > .6){ Snd.play('pluck', {f:196}); fire(); }
      else { pull = 0; draw(); if(!fini) c.say('Tire la corde un peu plus loin vers la gauche, puis lâche.'); }
    };
    s.addEventListener('pointerup', up); s.addEventListener('pointercancel', up);
    draw();
    c.onAlt = () => { pull = 1; draw(); c.later(fire, RM ? 0 : 250); };
  }
};

/* 11. L'étoile filante : l'attraper au vol */
G.filante = { hint:'Guette le ciel. Quand une étoile filante passe, attrape-la du doigt.', alt:'Faire un vœu',
  mount(c){
    const s = c.stage;
    for(let i = 0; i < 46; i++){
      const d = el('span', 'ciel-pt'); d.style.left = rnd(2, 98).toFixed(1) + '%'; d.style.top = rnd(2, 96).toFixed(1) + '%';
      d.style.setProperty('--o', rnd(.35, .95).toFixed(2)); d.style.setProperty('--t', rnd(1.4, 4).toFixed(1) + 's'); s.append(d);
    }
    const b = el('button', 'filante'); b.type = 'button'; b.setAttribute('aria-label', 'Attraper l\'étoile filante'); b.hidden = true; s.append(b);
    let anim = null, fini = false, passes = 0;
    const lance = () => {
      if(fini) return;
      const W = s.clientWidth, H = s.clientHeight, y0 = rnd(8, 38), y1 = y0 + rnd(22, 40), D = 2600 + Math.min(passes, 3) * 700;
      b.style.setProperty('--ang', (Math.atan2((y1 - y0) / 100 * H, 1.16 * W) * 180 / Math.PI).toFixed(1) + 'deg');
      b.hidden = false; if(anim) anim.cancel();
      if(b.animate) anim =b.animate([{left:'-8%', top:y0 + '%'}, {left:'108%', top:y1 + '%'}], {duration:D, easing:'linear', fill:'forwards'});
      passes++;
      if(passes === 3) c.say('Elle revient, plus lentement. Touche-la quand elle passe.');
      c.later(() => { if(!fini){ b.hidden = true; c.later(lance, 900); } }, D);
    };
    const attrape = () => {
      if(fini) return; fini = true; if(anim) anim.pause();
      s.classList.add('voeu'); Snd.play('twinkle'); buzz([20, 30, 20]); c.say('Fais un vœu… Il reste entre toi et les étoiles.');
      c.later(() => c.reveal(), RM ? 0 : 1900);
    };
    b.addEventListener('pointerdown', e => { e.preventDefault(); attrape(); });
    b.addEventListener('click', attrape);
    // Un toucher tout près de l'étoile compte aussi
    s.addEventListener('pointerdown', e => {
      if(fini || b.hidden) return; const r = b.getBoundingClientRect();
      if(Math.hypot(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2) < 80) attrape();
    });
    c.onAlt = attrape;
    if(RM || !b.animate){ b.style.left = '50%'; b.style.top = '40%'; b.hidden = false; c.say('Une étoile filante s\'est arrêtée pour toi. Touche-la.'); return; }
    c.later(lance, 900);
  }
};

G.fin = { hint:'Regarde…', alt:'Tout afficher',
  mount(c){
    c.stage.classList.add('tall'); c.stage.innerHTML = BIGROSE;
    const svg = c.stage.firstChild, paths = Array.from(svg.querySelectorAll('.rs path'));
    let fin = false;
    const end = () => { if(fin) return; fin = true; paths.forEach(p => { p.style.strokeDashoffset = 0; }); svg.classList.add('lit'); Snd.play('bloom'); buzz([40, 60, 40]); Music.swell();
      c.later(() => c.reveal(), RM ? 0 : 1400); };
    c.onAlt = () => { paths.forEach(p => { p.style.transition = 'none'; }); end(); };
    if(RM){ end(); return; }
    paths.forEach(p => { const L = Math.ceil(p.getTotalLength()) + 2; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
    svg.getBoundingClientRect();
    const total = 5200, step = total / paths.length;
    paths.forEach((p, i) => { p.style.transition = 'stroke-dashoffset ' + (step * 1.7 / 1000).toFixed(2) + 's ease-in-out ' + (i * step / 1000).toFixed(2) + 's, stroke 1.6s'; });
    requestAnimationFrame(() => paths.forEach(p => { p.style.strokeDashoffset = 0; }));
    c.later(end, total + step * .7);
  }
};

/* =========================================================
   DÉMARRAGE
   ========================================================= */
if(!RM){
  const pb = $('#petals');
  for(let i = 0; i < 9; i++){
    const p = el('span', 'petal'), s = rnd(9, 16);
    p.style.cssText = '--x:' + rnd(0, 100).toFixed(1) + '%;--d:' + rnd(16, 30).toFixed(1) + 's;--dl:' + (-rnd(0, 30)).toFixed(1) + 's;';
    const i2 = el('i'); i2.style.cssText = '--s:' + s.toFixed(1) + 'px;--sw:' + rnd(3, 6).toFixed(1) + 's;--o:' + rnd(.25, .5).toFixed(2) + ';';
    p.append(i2); pb.append(p);
  }
}
// Ouvert depuis l'icône : c'est installé, on ne le propose plus (Android partage cette mémoire avec Chrome)
if(STANDALONE) installFaite();
// Android : Chrome sait dire si l'appli est déjà sur l'écran d'accueil
if(!STANDALONE && navigator.getInstalledRelatedApps){
  navigator.getInstalledRelatedApps().then(l => { if(l && l.length) installFaite(); }).catch(() => {});
}
// Hors ligne : la page, les polices et les icônes restent dans le téléphone (sw.js)
if('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// Minuit ou 21 h passés pendant que la page est ouverte : on recharge le grimoire
setInterval(() => { if(!document.hidden && ST.key && ST.key !== iso(clock()) + '|' + unlocked()) boot(); }, 15000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && ST.key && ST.key !== iso(clock()) + '|' + unlocked()) boot(); });
/* ---------- À chaque arrivée : la vidéo de bienvenue (consigne d'Eliott) ----------
   Elle revient à chaque fois qu'elle ouvre le grimoire (nouvel onglet, lien rouvert),
   mais pas quand elle recharge la page ou navigue dedans pendant la même visite.
   Un toucher est nécessaire pour que le téléphone accepte le son. */
const INTRO_KEY = T.test ? 'grimoire.test.intro' : 'grimoire.intro';
// Déjà vue dans cette visite ET simple rechargement / retour arrière : on ne la relance pas.
// Lien rouvert (même dans le même onglet), nouvel onglet : elle revient.
const introVue = () => {
  let vue = false; try{ vue = sessionStorage.getItem(INTRO_KEY) === '1'; }catch(e){}
  let nav = ''; try{ nav = (performance.getEntriesByType('navigation')[0] || {}).type || ''; }catch(e){}
  return vue && (nav === 'reload' || nav === 'back_forward');
};
// Retour sur un onglet resté ouvert après 30 min ou plus d'absence : c'est une nouvelle arrivée.
let cacheDepuis = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ cacheDepuis = Date.now(); return; }
  if(cacheDepuis && Date.now() - cacheDepuis >= 30 * 60 * 1000 && !document.querySelector('.intro-v') && T.intro !== '0'){
    cacheDepuis = 0; nouvellePiste(); showIntro();
  }
});
function showIntro(){
  introOn = true;
  music(null);
  screen();
  const d = el('div', 'accueil');
  d.innerHTML = '<video class="boucle" src="accueil-boucle.mp4" poster="accueil-boucle.jpg" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>'
    + '<video class="ouv" src="accueil-ouverture.mp4" muted playsinline preload="auto" aria-hidden="true"></video>'
    + '<div class="voile"></div>'
    + '<div class="haut"><small>Le Grimoire</small><h1 class="msg" tabindex="-1">' + (S.intro ? 'Ton grimoire t’attend, princesse.' : 'Un grimoire t’attend, princesse.') + '</h1></div>'
    + '<div class="bas"></div>';
  const boucle = d.querySelector('.boucle'); boucle.muted = true;
  const lb = boucle.play(); if(lb) lb.catch(() => {});
  let fini = false;
  const done = () => {
    if(fini) return; fini = true; introOn = false;
    S.intro = 1; saveS();
    try{ sessionStorage.setItem(INTRO_KEY, '1'); }catch(e){}
    const a = document.querySelector('.accueil'); if(a) a.remove();
    const w = document.querySelector('.intro-v');
    if(w){
      const v = w.querySelector('video'), pos = v.currentTime || 0, t = pisteDuSoir(); try{ v.pause(); }catch(e){} w.remove();
      // La vidéo place l'envolée de la chanson à 26 s : le grimoire reprend la chanson au même endroit
      if(t && pos > 1) Music.suite = {track:t, at:Math.max(0, t.envol - 26) + pos};
    }
    boot();
  };
  const go = el('button', 'lbtn rouge', 'Ouvrir le grimoire'); go.type = 'button';
  go.onclick = () => {
    if(d.classList.contains('ouvre')) return;
    reveilSon();   // la musique suivra dans le grimoire (sauf si elle a coupé le son)
    const src = 'intro-' + (pisteDuSoir() || MUSIQUES[0]).fichier.replace(/\.mp3$/, '') + '.mp4?v=2';
    const w = el('div', 'intro-v');
    w.innerHTML = '<video playsinline preload="auto" src="' + src + '" aria-describedby="intro-txt"></video>'
      + '<button class="intro-skip" type="button">Passer</button>'
      + '<p id="intro-txt" class="sr-only">L’œil d’une chouette s’ouvre, la pleine lune dans la pupille. La nuit, quelqu’un veille. Ses serres tiennent une page scellée de cire rouge : il t’a écrit une page. La chouette passe devant la lune, au-dessus d’un temple grec, puis traverse une ville endormie pour toi. Elle se pose à une fenêtre éclairée et y dépose la page. Ta page t’attend. Signé Dieu.</p>';
    const v = w.querySelector('video');
    v.muted = !Snd.on;   // si elle a coupé le son, la vidéo reste muette aussi
    // iPhone : la vidéo de la chouette doit être lancée pendant le toucher pour garder le son ; on l'arrête aussitôt
    let prete = false;
    try{ const p0 = v.play(); if(p0) p0.then(() => { if(!prete){ v.pause(); v.currentTime = 0; } }).catch(() => {}); }catch(e){}
    w.style.visibility = 'hidden'; document.body.append(w);
    // Le grimoire s'ouvre (5 s), puis la chouette
    const ouv = d.querySelector('.ouv');
    let lance = false;
    const chouette = () => {
      if(lance || fini) return; lance = true; prete = true;
      w.style.visibility = ''; d.remove();
      try{ v.currentTime = 0; }catch(e){}
      v.onended = done; v.onerror = done;
      w.querySelector('.intro-skip').onclick = done;
      const pr = v.play();
      if(pr) pr.catch(() => { v.muted = true; v.play().catch(done); });
      focusSoft(w.querySelector('.intro-skip'));
    };
    d.classList.add('ouvre');
    if(RM){ chouette(); return; }
    ouv.onended = chouette; ouv.onerror = chouette;
    setTimeout(chouette, 6500);   // filet de sécurité
    const po = ouv.play(); if(po) po.catch(chouette);
  };
  d.querySelector('.bas').append(go);
  document.body.append(d);
  focusSoft(d.querySelector('h1'));
}
// Nouvelle visite = nouvelle musique ; un rechargement ou un retour arrière garde celle de la visite
let navType = ''; try{ navType = (performance.getEntriesByType('navigation')[0] || {}).type || ''; }catch(e){}
if(navType === 'reload' || navType === 'back_forward') pisteDuSoir(); else nouvellePiste();
if((!introVue() && T.intro !== '0') || T.intro === '1') showIntro(); else boot();
})();
</script>
